name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    env:
      # Qt otherwise selects the native Windows platform plugin, which makes
      # widget tests depend on an interactive desktop being available.
      QT_QPA_PLATFORM: offscreen
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip setuptools wheel
      # UI tests import PySide6, so the test matrix must install runtime dependencies.
      - run: python -m pip install -e .
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall -q src tests
      - run: python -m pip wheel . --no-deps --no-build-isolation -w dist-wheel

  exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - shell: pwsh
        run: .\scripts\build-exe.ps1
      - shell: pwsh
        run: Compress-Archive -Path dist/PokeTokenBar-Windows/* -DestinationPath dist/PokeTokenBar-Windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: PokeTokenBar-Windows
          path: dist/PokeTokenBar-Windows.zip
