[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "poketokenbar-windows"
version = "0.1.0"
description = "Windows port of PokeTokenBar: turn local AI coding token usage into a Pokemon companion"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "PokeTokenBar Windows contributors" }]
dependencies = ["PySide6>=6.7"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Win32 (MS Windows)",
  "License :: OSI Approved :: MIT License",
  "Operating System :: Microsoft :: Windows :: Windows 10",
  "Operating System :: Microsoft :: Windows :: Windows 11",
  "Programming Language :: Python :: 3",
]

[project.optional-dependencies]
build = ["pyinstaller>=6.10"]

[project.gui-scripts]
poketokenbar-windows = "poketokenbar_windows.app:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
poketokenbar_windows = ["qml/*.qml"]
